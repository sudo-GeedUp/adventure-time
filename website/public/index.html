<!doctype html>
<html lang="en">
  <head>

    <title>Its Adventure Time - Legal Documents</title>
    <style>
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        line-height: 1.6;
        color: #333;
        max-width: 800px;
        margin: 0 auto;
        padding: 40px 20px;
        text-align: center;
      }
      h1 {
        color: #2c3e50;
        margin-bottom: 40px;
      }
      .link-container {
        display: flex;
        gap: 20px;

        background: #3498db;
        color: white;
        text-decoration: none;
        border-radius: 8px;
        font-weight: 600;
        transition: background 0.3s;
      }
      .legal-link:hover {
        background: #2980b9;
      }

    <h1>Its Adventure Time - Legal Documents</h1>
    <div class="link-container">
      <a href="terms-of-use" class="legal-link">Terms of Use (EULA)</a>
